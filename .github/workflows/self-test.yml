name: Self-test
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile scanner
        run: python -m py_compile agent_hardening_check.py
      - name: Run local action
        id: hardening
        uses: ./
      - name: Validate SARIF
        run: |
          test -s agent-hardening-scan.sarif
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('agent-hardening-scan.sarif').read_text())
          assert data['version']=='2.1.0'
          assert data['runs']
          PY
